<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>PassShare</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #09090b 0%, #18181b 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      border-radius: 20px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .version {
      color: #71717a;
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }
    .status {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #27272a;
    }
    .status-item:last-child { border-bottom: none; }
    .status-label { color: #a1a1aa; }
    .status-value { color: #22c55e; font-weight: 500; }
    .btn {
      background: #22c55e;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #16a34a; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🔐</div>
    <h1>PassShare</h1>
    <p class="version">Version 1.0.0</p>
    
    <div class="status">
      <div class="status-item">
        <span class="status-label">ストア</span>
        <span class="status-value" id="store-status">読み込み中...</span>
      </div>
      <div class="status-item">
        <span class="status-label">GPG</span>
        <span class="status-value" id="gpg-status">確認中...</span>
      </div>
      <div class="status-item">
        <span class="status-label">Git</span>
        <span class="status-value" id="git-status">確認中...</span>
      </div>
    </div>
    
    <button class="btn" onclick="openVault()">Vault を開く</button>
  </div>
  
  <script>
    // Initialize status
    setTimeout(() => {
      document.getElementById('store-status').textContent = '準備完了';
      document.getElementById('gpg-status').textContent = '利用可能';
      document.getElementById('git-status').textContent = '接続済み';
    }, 1000);
    
    function openVault() {
      if (window.passshare) {
        window.passshare.list().then(secrets => {
          console.log('Secrets:', secrets);
        });
      } else {
        alert('PassShare Vaultを開きます');
      }
    }
  </script>
</body>
</html>
