[package]
name = "passshare-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PassShare cryptographic core and password box domain logic"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
argon2.workspace = true
chacha20poly1305.workspace = true
# Unify erasure for the authentication state used by the existing AEAD crate.
poly1305.workspace = true
rand.workspace = true
zeroize.workspace = true
base64.workspace = true
getrandom.workspace = true
tempfile.workspace = true
csv = "1.3"
# RFC 9180 HPKE Auth for shared PasswordBoxKey wrapping; only the fixed
# X25519 / HKDF-SHA256 / ChaCha20Poly1305 suite is enabled.
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "x25519", "chacha"] }
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true
