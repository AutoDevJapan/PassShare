[project]
name = "passshare-connect"
version = "0.1.0"
description = "1Password Connect API compatible Python client for PassShare"
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["passshare_connect*"]
