[package]
name = "passshare-cloud-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
passshare-core = { path = "../../crates/passshare-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zeroize = "1"
argon2 = { version = "0.5", features = ["zeroize"] }
unicode-normalization = "0.1"
wasm-bindgen = "=0.2.122"
js-sys = "=0.3.99"

[dev-dependencies]
wasm-bindgen-test = "=0.3.72"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[profile.test.package.argon2]
opt-level = "s"
[profile.test.package.blake2]
opt-level = "s"
