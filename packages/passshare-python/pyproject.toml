[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "passshare"
version = "1.0.0"
description = "A gopass-compatible password manager for teams and individuals"
readme = "README.md"
license = "MIT"
authors = [
    { name = "BM1314", email = "info@bm1314.co.jp" }
]
keywords = ["password", "manager", "gpg", "gopass", "pass", "security", "encryption"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.1",
    "pyotp>=2.9",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.2",
    "types-PyYAML>=6.0",
]

[project.scripts]
passshare = "passshare.cli:main"

[project.urls]
Homepage = "https://pass-share.bm1314.net"
Documentation = "https://pass-share.bm1314.net/docs"
Repository = "https://github.com/bm1314/passshare"
Issues = "https://github.com/bm1314/passshare/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/passshare"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM102", "SIM105", "SIM108", "SIM110"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=passshare --cov-report=term-missing"

[tool.coverage.run]
source = ["src/passshare"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
