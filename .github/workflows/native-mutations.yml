name: Native mutations
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-mutations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend/native
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - run: cargo fmt --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --release --locked
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - run: pnpm --dir .. install --frozen-lockfile
      - name: Verify native service through the real memory API
        run: ./target/release/acceptance
        if: runner.os != 'Windows'
      - name: Verify native service through the real memory API (Windows)
        run: ./target/release/acceptance.exe
        if: runner.os == 'Windows'
      - name: Verify one-time account recovery through the real memory API
        run: ./target/release/acceptance --recovery-only
        if: runner.os != 'Windows'
      - name: Verify one-time account recovery through the real memory API (Windows)
        run: ./target/release/acceptance.exe --recovery-only
        if: runner.os == 'Windows'
      - name: Verify account retirement and shared ownership through the real memory API
        run: ./target/release/acceptance --retirement-only
        if: runner.os != 'Windows'
      - name: Verify account retirement and shared ownership through the real memory API (Windows)
        run: ./target/release/acceptance.exe --retirement-only
        if: runner.os == 'Windows'
      - name: Verify recovery key, recovery and retirement pages through the real memory API
        run: ./target/release/acceptance --lifecycle-ui-only
        if: runner.os != 'Windows'
      - name: Verify recovery key, recovery and retirement pages through the real memory API (Windows)
        run: ./target/release/acceptance.exe --lifecycle-ui-only
        if: runner.os == 'Windows'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-mutations-${{ matrix.os }}
          path: |
            backend/native/target/release/passshare-mutations*
            backend/native/target/release/acceptance*
            backend/native/target/release/preview*
            backend/native/Cargo.lock
          if-no-files-found: error
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: passshare
          POSTGRES_PASSWORD: passshare
          POSTGRES_DB: passshare
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Install the PostgreSQL acceptance client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql --version
      - run: cargo build --manifest-path backend/native/Cargo.toml --release --locked
      - name: Verify atomic PostgreSQL operations and restart
        run: backend/native/target/release/acceptance
        env:
          DATABASE_URL: postgresql://passshare:passshare@127.0.0.1:5432/passshare
      - name: Verify one-time PostgreSQL recovery and overlapping requests
        run: backend/native/target/release/acceptance --recovery-only
        env:
          DATABASE_URL: postgresql://passshare:passshare@127.0.0.1:5432/passshare
      - name: Verify PostgreSQL retirement rollback and credential races
        run: backend/native/target/release/acceptance --retirement-only
        env:
          DATABASE_URL: postgresql://passshare:passshare@127.0.0.1:5432/passshare
      - name: Verify recovery key, recovery and retirement pages against PostgreSQL
        run: backend/native/target/release/acceptance --lifecycle-ui-only
        env:
          DATABASE_URL: postgresql://passshare:passshare@127.0.0.1:5432/passshare
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Install dependencies for the independent quota fixture
        run: pnpm --dir backend install --frozen-lockfile
      - run: cargo build --manifest-path backend/native/Cargo.toml --release --locked --bin acceptance
      - name: Build the actual API distribution image
        run: docker build -t passshare-todo1163-api backend
      - name: Verify native operations through the distribution image
        run: |
          docker run -d --name passshare-todo1163-api -p 127.0.0.1:8094:8080 -e APP_ENV=local passshare-todo1163-api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8094/health >/dev/null; then break; fi
            sleep 1
          done
          backend/native/target/release/acceptance 8094
          docker restart passshare-todo1163-api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8094/health >/dev/null; then break; fi
            sleep 1
          done
          backend/native/target/release/acceptance 8094 --recovery-only
          docker restart passshare-todo1163-api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8094/health >/dev/null; then break; fi
            sleep 1
          done
          backend/native/target/release/acceptance 8094 --retirement-only
          docker restart passshare-todo1163-api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8094/health >/dev/null; then break; fi
            sleep 1
          done
          backend/native/target/release/acceptance 8094 --lifecycle-ui-only
      - name: Remove the owned container and image
        if: always()
        run: |
          if docker container inspect passshare-todo1163-api >/dev/null 2>&1; then docker rm -fv passshare-todo1163-api; fi
          if docker image inspect passshare-todo1163-api >/dev/null 2>&1; then docker rmi -f passshare-todo1163-api; fi
          test -z "$(docker ps -aq --filter name=passshare-todo1163-api)"
