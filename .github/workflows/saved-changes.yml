name: Saved changes
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: saved-changes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Check changed Rust formatting
        run: rustfmt --edition 2021 --check crates/passshare-core/src/password_box.rs crates/passshare-core/src/password_box_saved_tests.rs apps/desktop/src-tauri/src/lib.rs
      - name: Prove all six save-failure tests reject publishing before the save
        shell: bash
        run: |
          git apply documents/evidence/1197-save-before-commit-regression.patch
          set +e
          cargo test -p passshare-core --locked saved_change_tests -- --test-threads=1 > regression.log 2>&1
          result=$?
          set -e
          cat regression.log
          git apply --reverse documents/evidence/1197-save-before-commit-regression.patch
          test "$result" -eq 101
          test "$(grep -c '^test password_box::saved_change_tests::saved_.* FAILED$' regression.log)" -eq 6
          grep -q '2 passed; 6 failed' regression.log
          git diff --exit-code
      - name: Verify real encrypted save and reopen with the fixed implementation
        run: cargo test -p passshare-core --locked -- --test-threads=1
      - name: Check core lint
        run: cargo clippy -p passshare-core --all-targets --locked -- -D warnings
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: saved-changes-${{ matrix.os }}
          path: regression.log
          if-no-files-found: warn
