concurrency:
  cancel-in-progress: true
  group: quality-gate-${{ github.ref }}
jobs:
  backend:
    env:
      PASSSHARE_MUTATIONS_BIN: ${{ github.workspace }}/backend/native/target/release/passshare-mutations
    name: Backend
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Build native invitation verification
        run: cargo build --manifest-path backend/native/Cargo.toml --release --locked --bin passshare-mutations
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
          node-version: "22"
      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend
      - name: Verify DB migration script
        run: pnpm run migrate:verify
        working-directory: backend
      - name: Run backend tests
        run: pnpm test
        working-directory: backend
      - name: Verify production backend image
        run: |
          docker build --tag passshare-backend-ci:verify backend
          docker run --rm --network none --cpus 1 --memory 768m \
            --mount "type=bind,source=$PWD/backend/test,target=/app/test,readonly" \
            passshare-backend-ci:verify node --test \
            test/auth-api.test.js test/mobile-auth.test.js \
            test/extension-auth.test.js test/connect-api.test.js \
            test/connect-api-extended.test.js test/security-headers.test.js \
            test/web-session.test.js
      - if: always()
        name: Remove verification image
        run: |
          if docker image inspect passshare-backend-ci:verify >/dev/null 2>&1; then
            docker image rm passshare-backend-ci:verify
          fi
  benchmark:
    name: Performance benchmarks
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
          node-version: "22"
      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend
      - name: Run benchmark suite
        run: node scripts/bench/run.mjs
      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: benchmark-results
          path: bench-results.json
  connect-go:
    defaults:
      run:
        working-directory: packages/connect-go
    env:
      GOTOOLCHAIN: local
    name: Connect SDK (Go ${{ matrix.go }})
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          cache: false
          go-version: ${{ matrix.go }}
      - run: go version
      - name: Check Go formatting
        run: test -z "$(gofmt -l *.go)"
      - name: Run SDK tests with the race detector
        run: go test -race -count=1 ./...
      - name: Check SDK with go vet
        run: go vet ./...
    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.22.x
          - stable
    timeout-minutes: 10
  connect-js:
    name: Connect SDK (TypeScript)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: pnpm
          cache-dependency-path: packages/connect-js/pnpm-lock.yaml
          node-version: "22"
      - name: Install connect-js dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/connect-js
      - name: Run connect-js tests
        run: pnpm test
        working-directory: packages/connect-js
  connect-types:
    name: Connect API types
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
          node-version: "22"
      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend
      - name: Generate Connect API types
        run: pnpm run generate:types
        working-directory: backend
      - name: Fail on generated type drift
        run: git diff --exit-code packages/connect-js/src/generated/connect-api.ts
  desktop-smoke:
    if: needs.preflight.outputs.desktop == 'true'
    name: Desktop smoke
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - name: Run cloud sync unit tests
        run: |
          pnpm --dir packages/connect-js install --frozen-lockfile
          pnpm --dir packages/connect-js run build
          pnpm --dir apps/desktop install --frozen-lockfile
          pnpm --dir apps/desktop exec tsc --noEmit
          pnpm --dir apps/desktop run test
      - name: Run desktop smoke tests
        run: |
          cargo test -p passshare-desktop smoke_
          cargo test -p passshare-desktop native_lock::tests
  docker-e2e:
    name: Docker E2E (API + PostgreSQL)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Run PostgreSQL integration tests
        run: docker compose -f docker/docker-compose.test.yml run --rm backend-e2e
    timeout-minutes: 45
  extension:
    name: Extension (unit + E2E smoke)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: pnpm
          cache-dependency-path: |
            packages/extension/pnpm-lock.yaml
            packages/connect-js/pnpm-lock.yaml
            backend/pnpm-lock.yaml
          node-version: "22"
      - name: Install dependencies
        run: |
          pnpm --dir packages/connect-js install --frozen-lockfile
          pnpm --dir packages/connect-js run build
          pnpm --dir packages/extension install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
          pnpm install --frozen-lockfile
      - name: Run extension unit tests
        run: pnpm --dir packages/extension test
      - name: Build extension
        run: pnpm --dir packages/extension run build
      - name: Run extension auth API tests
        run: node --test test/extension-auth.test.js
        working-directory: backend
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
      - env:
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
          USE_XVFB: "1"
        name: Run extension E2E smoke
        run: xvfb-run -a pnpm exec playwright test -c playwright.extension.config.ts
  frontend:
    env:
      PASSSHARE_MUTATIONS_BIN: ${{ github.workspace }}/backend/native/target/release/passshare-mutations
    name: Web (Playwright + build)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Build native mutation service
        run: cargo build --manifest-path backend/native/Cargo.toml --release --locked --bin passshare-mutations
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            packages/connect-js/pnpm-lock.yaml
          node-version: "22"
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir packages/connect-js install --frozen-lockfile
          pnpm --dir packages/connect-js run build
          pnpm --dir frontend install --frozen-lockfile
      - name: Type-check frontend
        run: pnpm --dir frontend exec tsc --noEmit
      - name: Build frontend
        run: pnpm --dir frontend run build
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - env:
          CI: "true"
        name: Run Playwright E2E
        run: pnpm exec playwright test --project=chromium
      - env:
          CI: "true"
        name: Run i18n visual regression
        run: pnpm exec playwright test --project=i18n-visual
  gate:
    if: ${{ !cancelled() }}
    name: Quality gate
    needs:
      - preflight
      - rust-docker
      - docker-e2e
      - backend
      - connect-types
      - connect-js
      - connect-go
      - i18n
      - frontend
      - extension
      - desktop-smoke
      - mobile-smoke
      - benchmark
    runs-on: ubuntu-latest
    steps:
      - env:
          DESKTOP: ${{ needs.preflight.outputs.desktop }}
          MOBILE: ${{ needs.preflight.outputs.mobile }}
          RESULTS: ${{ toJSON(needs) }}
        name: Require successful checks or an explicitly unaffected client
        run: echo "$RESULTS" | jq -e --arg desktop "$DESKTOP" --arg mobile "$MOBILE" 'to_entries | all(if .key == "desktop-smoke" then (.value.result == "success" or (.value.result == "skipped" and $desktop == "false")) elif .key == "mobile-smoke" then (.value.result == "success" or (.value.result == "skipped" and $mobile == "false")) else .value.result == "success" end)'
  i18n:
    name: i18n key parity
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
      - name: Check locale key parity
        run: node scripts/i18n-check.mjs
      - name: Check jp-ui-contracts (Issue
        run: node scripts/jp-ui-contracts-check.mjs
      - name: Export i18n design copy (drift check)
        run: node scripts/export-i18n-design-copy.mjs
  mobile-smoke:
    if: needs.preflight.outputs.mobile == 'true'
    needs: preflight
    uses: ./.github/workflows/mobile-build.yml
  preflight:
    name: Change scope and inexpensive checks
    outputs:
      desktop: ${{ steps.scope.outputs.desktop }}
      mobile: ${{ steps.scope.outputs.mobile }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        id: scope
        name: Determine affected native clients
        run: |
          set -euo pipefail
          desktop=false
          mobile=false
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then
            desktop=true
            mobile=true
          else
            git diff --no-renames --name-only -z "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/passshare-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                apps/desktop/*) desktop=true ;;
                apps/mobile/*) mobile=true ;;
                frontend/*|packages/extension/*|e2e/web/*|e2e/extension/*) ;;
                *) desktop=true; mobile=true ;;
              esac
            done < "$RUNNER_TEMP/passshare-paths"
          fi
          printf 'desktop=%s\nmobile=%s\n' "$desktop" "$mobile" >> "$GITHUB_OUTPUT"
          printf 'Desktop tests: %s; mobile tests: %s\n' "$desktop" "$mobile" >> "$GITHUB_STEP_SUMMARY"
        shell: bash
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Check mobile acceptance formatting
        run: rustfmt --edition 2021 --check crates/passshare-core/examples/mobile_auth_acceptance.rs
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          cache: false
          go-version-file: tools/desktop-release-check/go.mod
      - env:
          TEST_SCRATCH: ${{ runner.temp }}
        name: Test candidate verifier without signing secrets
        run: go test -mod=readonly ./...
        working-directory: tools/desktop-release-check
    timeout-minutes: 10
  rust-docker:
    name: Rust (Docker)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Run Rust tests in Docker
        run: docker compose -f docker/docker-compose.test.yml run --rm --build test
name: Quality Gate
"on":
  pull_request: null
  push:
    branches:
      - main
permissions:
  contents: read
