name: Quality Gate

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-docker:
    name: Rust (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Rust tests in Docker
        run: docker compose -f docker/docker-compose.test.yml run --rm --build test

  docker-e2e:
    name: Docker E2E (API + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # op-cli is built inside the backend-e2e container (same rust:1.86-bookworm
      # base that runs it) so the binary's glibc matches the runtime. Building on
      # the host (newer ubuntu glibc) risked GLIBC_x.xx-not-found at runtime and
      # made the job non-hermetic (#320).
      - name: Run PostgreSQL integration tests
        run: docker compose -f docker/docker-compose.test.yml run --rm backend-e2e

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Verify DB migration script
        working-directory: backend
        run: pnpm run migrate:verify

      - name: Run backend tests
        working-directory: backend
        run: pnpm test

      - name: Verify production backend image
        run: |
          docker build --tag passshare-backend-ci:verify backend
          docker run --rm --network none --cpus 1 --memory 768m \
            --mount "type=bind,source=$PWD/backend/test,target=/app/test,readonly" \
            passshare-backend-ci:verify node --test \
            test/auth-api.test.js test/mobile-auth.test.js \
            test/extension-auth.test.js test/connect-api.test.js \
            test/connect-api-extended.test.js test/security-headers.test.js \
            test/web-session.test.js

      - name: Remove verification image
        if: always()
        run: |
          if docker image inspect passshare-backend-ci:verify >/dev/null 2>&1; then
            docker image rm passshare-backend-ci:verify
          fi

  connect-types:
    name: Connect API types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Generate Connect API types
        working-directory: backend
        run: pnpm run generate:types

      - name: Fail on generated type drift
        run: git diff --exit-code packages/connect-js/src/generated/connect-api.ts

  connect-js:
    name: Connect SDK (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: packages/connect-js/pnpm-lock.yaml

      - name: Install connect-js dependencies
        working-directory: packages/connect-js
        run: pnpm install --frozen-lockfile

      - name: Run connect-js tests
        working-directory: packages/connect-js
        run: pnpm test

  i18n:
    name: i18n key parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Check locale key parity
        run: node scripts/i18n-check.mjs

      - name: Check jp-ui-contracts (Issue #130)
        run: node scripts/jp-ui-contracts-check.mjs

      - name: Export i18n design copy (drift check)
        run: node scripts/export-i18n-design-copy.mjs

  frontend:
    name: Web (Playwright + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            packages/connect-js/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir packages/connect-js install --frozen-lockfile
          pnpm --dir packages/connect-js run build
          pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir frontend run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright E2E
        env:
          CI: "true"
        run: pnpm exec playwright test --project=chromium

      - name: Run i18n visual regression
        env:
          CI: "true"
        run: pnpm exec playwright test --project=i18n-visual

  extension:
    name: Extension (unit + E2E smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            packages/extension/pnpm-lock.yaml
            packages/connect-js/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --dir packages/connect-js install --frozen-lockfile
          pnpm --dir packages/connect-js run build
          pnpm --dir packages/extension install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Run extension unit tests
        run: pnpm --dir packages/extension test

      - name: Build extension
        run: pnpm --dir packages/extension run build

      - name: Run extension auth API tests
        working-directory: backend
        run: node --test test/extension-auth.test.js

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run extension E2E smoke
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
          USE_XVFB: "1"
        run: xvfb-run -a pnpm exec playwright test -c playwright.extension.config.ts

  desktop-smoke:
    name: Desktop smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run desktop smoke tests
        run: cargo test -p passshare-desktop smoke_

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Run cloud sync unit tests
        run: |
          pnpm --dir packages/connect-js install --frozen-lockfile
          pnpm --dir packages/connect-js run build
          pnpm --dir apps/desktop install --frozen-lockfile
          pnpm --dir apps/desktop run test

  mobile-smoke:
    name: Mobile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run mobile smoke tests
        run: cargo test -p passshare-mobile smoke_

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            apps/mobile/pnpm-lock.yaml
            packages/connect-js/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --dir packages/connect-js install --frozen-lockfile
          pnpm --dir packages/connect-js run build
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile

      - name: Build mobile frontend
        run: pnpm --dir apps/mobile run build

      - name: Run mobile unit tests
        run: pnpm --dir apps/mobile run test

      - name: Run mobile auth API tests
        working-directory: backend
        run: node --test test/mobile-auth.test.js

  # NOTE: cargo-audit / pnpm-audit live in security-audit.yml (single SSOT for
  # dependency advisories, #325). Advisory scans are non-blocking on PRs (a newly
  # published CVE must not redden unrelated PRs) and a hard gate on main + the
  # nightly schedule. They are intentionally NOT a `needs:` of this gate.

  benchmark:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Run benchmark suite
        run: node scripts/bench/run.mjs

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: bench-results.json
          if-no-files-found: error

  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      - rust-docker
      - docker-e2e
      - backend
      - connect-types
      - connect-js
      - i18n
      - frontend
      - extension
      - desktop-smoke
      - mobile-smoke
      - benchmark
    steps:
      - name: All quality checks passed
        run: echo "Quality gate green"
