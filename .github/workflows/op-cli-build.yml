name: op-cli Build

# Windows first. macOS follows Windows completion; Linux packages are deferred.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: op-cli-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: op-cli-windows
            bin_path: target/release/op.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Build op-cli release
        run: cargo build -p op-cli --release

      - name: Upload op-cli artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin_path }}
          if-no-files-found: error
