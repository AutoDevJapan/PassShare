name: Cloud WASM acceptance
on:
  workflow_dispatch:
  pull_request:
    paths: ['packages/cloud-wasm/**', 'crates/passshare-core/**', 'backend/native/src/edit.rs', 'Cargo.toml', 'Cargo.lock', 'frontend/src/lib/cloud-worker.ts', 'frontend/src/lib/sharing-api.ts', 'frontend/src/pages/app/CloudSharingPanel.tsx', 'frontend/src/pages/app/VaultSharePage.tsx', 'frontend/src/hooks/useAuthSession.tsx', 'apps/mobile/package.json', 'apps/mobile/pnpm-lock.yaml', '.github/workflows/cloud-wasm.yml']
  push:
    branches: [main]
    paths: ['packages/cloud-wasm/**', 'crates/passshare-core/**', 'backend/native/src/edit.rs', 'Cargo.toml', 'Cargo.lock', 'frontend/src/lib/cloud-worker.ts', 'frontend/src/lib/sharing-api.ts', 'frontend/src/pages/app/CloudSharingPanel.tsx', 'frontend/src/pages/app/VaultSharePage.tsx', 'frontend/src/hooks/useAuthSession.tsx', 'apps/mobile/package.json', 'apps/mobile/pnpm-lock.yaml', '.github/workflows/cloud-wasm.yml']
permissions:
  contents: read
concurrency:
  group: cloud-wasm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cloud-wasm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - name: Install the fixed TypeScript and React transport host
        run: pnpm --dir ../../apps/mobile install --frozen-lockfile --ignore-scripts
      - run: cargo fmt --check
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Install the matching WASM bindings runner
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked
      - name: Execute the exported WASM boundary in Node
        run: |
          cargo test --locked --target wasm32-unknown-unknown --test wasm
          cargo test --locked --target wasm32-unknown-unknown --test shared_key
          cargo test --locked --target wasm32-unknown-unknown --test shared_api
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      - name: Generate browser bindings from the tested module
        run: |
          wasm-bindgen target/wasm32-unknown-unknown/release/passshare_cloud_wasm.wasm --target nodejs --out-dir node-pkg
          cargo run --locked --example release_acceptance -- node-pkg/passshare_cloud_wasm.js
          cargo run --locked --example web_transport_acceptance -- "$PWD/node-pkg/passshare_cloud_wasm.js" "$GITHUB_WORKSPACE/apps/mobile/node_modules/typescript" "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/apps/mobile/node_modules/react-test-renderer"
          wasm-bindgen target/wasm32-unknown-unknown/release/passshare_cloud_wasm.wasm --target web --out-dir pkg
          cp worker/boot.mjs pkg/boot.mjs
          cargo run --locked --example release_acceptance -- --web pkg/passshare_cloud_wasm.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: passshare-cloud-wasm
          path: packages/cloud-wasm/pkg
          if-no-files-found: error
