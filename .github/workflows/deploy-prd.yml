name: Deploy Production Backend

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy-prd' to confirm production deploy"
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-backend-production:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'deploy-prd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          echo '/usr/lib/postgresql/18/bin' >> "$GITHUB_PATH"

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Snapshot prd DB, then deploy
        env:
          DEPLOY_TARGET: prd
          DB_REPLICA_MODE: snapshot
          DB_REPLICA_SOURCE: prd
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_PRODUCTION_ENV_ID }}
          RAILWAY_PRODUCTION_ENV_ID: ${{ secrets.RAILWAY_PRODUCTION_ENV_ID }}
          # Postgres service ID is required (no hardcoded fallback, #325).
          # Snapshot mode reads prd only (no destructive wipe).
          RAILWAY_POSTGRES_PRD_SERVICE_ID: ${{ secrets.RAILWAY_POSTGRES_PRD_SERVICE_ID }}
          RAILWAY_HEALTH_URL: https://pass-share-backend-production.up.railway.app/health/db
        run: bash scripts/railway-deploy-with-replica.sh

      # SECURITY: never upload the production DB dump as a GitHub Actions artifact.
      # Repository readers may download artifacts; a DB artifact would expose
      # production rows on every deploy (#318). The
      # snapshot reads prd only: it is not restored to another environment. It is
      # discarded after this job and is not a retained backup or a paid service.
      - name: Remove local prd DB dump
        if: always()
        run: rm -f passshare-snapshot-replica-*.dump
