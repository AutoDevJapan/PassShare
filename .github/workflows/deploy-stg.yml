name: Deploy Staging Backend

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy-stg' to confirm staging deploy (refreshes DB from prd replica)"
        required: true
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-backend-staging:
    if: github.event.inputs.confirm == 'deploy-stg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Refresh stg DB from prd replica, then deploy
        env:
          DEPLOY_TARGET: stg
          DB_REPLICA_MODE: refresh
          DB_REPLICA_SOURCE: prd
          DB_REPLICA_TARGET: stg
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_STAGING_ENV_ID }}
          RAILWAY_PRODUCTION_ENV_ID: ${{ secrets.RAILWAY_PRODUCTION_ENV_ID }}
          RAILWAY_STAGING_ENV_ID: ${{ secrets.RAILWAY_STAGING_ENV_ID }}
          RAILWAY_DEVELOPMENT_ENV_ID: ${{ secrets.RAILWAY_DEVELOPMENT_ENV_ID }}
          RAILWAY_HEALTH_URL: https://pass-share-backend-staging.up.railway.app/health/db
        run: bash scripts/railway-deploy-with-replica.sh
