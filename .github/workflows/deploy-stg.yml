name: Deploy Staging Backend

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy-stg' to confirm staging deploy (refreshes DB from prd replica)"
        required: true
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-backend-staging:
    if: github.event.inputs.confirm == 'deploy-stg'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Refresh stg DB from prd replica, then deploy
        env:
          DEPLOY_TARGET: stg
          DB_REPLICA_MODE: refresh
          DB_REPLICA_SOURCE: prd
          DB_REPLICA_TARGET: stg
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_STAGING_ENV_ID }}
          RAILWAY_PRODUCTION_ENV_ID: ${{ secrets.RAILWAY_PRODUCTION_ENV_ID }}
          RAILWAY_STAGING_ENV_ID: ${{ secrets.RAILWAY_STAGING_ENV_ID }}
          RAILWAY_DEVELOPMENT_ENV_ID: ${{ secrets.RAILWAY_DEVELOPMENT_ENV_ID }}
          # Postgres service IDs are required (no hardcoded fallback, #325).
          # Refresh reads prd (source) and stg (target) DBs.
          RAILWAY_POSTGRES_PRD_SERVICE_ID: ${{ secrets.RAILWAY_POSTGRES_PRD_SERVICE_ID }}
          RAILWAY_POSTGRES_STG_SERVICE_ID: ${{ secrets.RAILWAY_POSTGRES_STG_SERVICE_ID }}
          RAILWAY_HEALTH_URL: https://pass-share-backend-staging.up.railway.app/health/db
        run: bash scripts/railway-deploy-with-replica.sh
