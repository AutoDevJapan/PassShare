name: Deploy Development Backend

permissions:
  contents: read

on:
  push:
    branches: [main]

concurrency:
  group: deploy-development
  cancel-in-progress: true

jobs:
  deploy-backend-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy backend to Railway (development)
        env:
          # Account/team token: supply via RAILWAY_API_TOKEN only. Do NOT also set
          # RAILWAY_TOKEN — the CLI would treat the account token as a project token
          # and fail `railway up` with "Unauthorized". The deploy script authenticates
          # with RAILWAY_API_TOKEN + explicit --project/--service/--environment flags.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_DEVELOPMENT_ENV_ID }}
          RAILWAY_HEALTH_URL: https://pass-share-backend-development.up.railway.app/health/db
        run: bash scripts/railway-deploy-ci.sh
