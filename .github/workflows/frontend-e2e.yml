name: Frontend E2E

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            packages/connect-js/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir packages/connect-js install --frozen-lockfile
          pnpm --dir packages/connect-js run build
          pnpm --dir frontend install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir frontend run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright E2E (auth CRUD)
        env:
          CI: "true"
        run: pnpm exec playwright test --project=chromium

      - name: Run i18n visual regression
        env:
          CI: "true"
        run: pnpm exec playwright test --project=i18n-visual
