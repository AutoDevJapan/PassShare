name: Staging Smoke

on:
  workflow_dispatch:

concurrency:
  group: stg-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Run staging smoke checks
        env:
          STG_BACKEND_URL: https://pass-share-backend-staging.up.railway.app
          STG_OP_CONNECT_TOKEN: ${{ secrets.STG_OP_CONNECT_TOKEN }}
        run: node scripts/stg-smoke.mjs
