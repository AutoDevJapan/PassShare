name: Mobile Build

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            apps/mobile/pnpm-lock.yaml
            packages/connect-js/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: |
          pnpm --dir packages/connect-js install --frozen-lockfile
          pnpm --dir packages/connect-js run build
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir apps/mobile run build

      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Run mobile smoke tests
        run: cargo test -p passshare-mobile smoke_

      - name: Run mobile auth API tests
        working-directory: backend
        run: node --test test/mobile-auth.test.js
