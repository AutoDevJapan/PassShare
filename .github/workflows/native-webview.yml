name: Native WebView acceptance
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-webview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - name: Install native runtime and driver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus-x11 at-spi2-core
          cargo install tauri-driver --version 2.1.0 --locked
      - name: Build actual frontend assets and finite Rust acceptance
        run: |
          pnpm --dir packages/connect-js install --frozen-lockfile
          pnpm --dir packages/connect-js run build
          pnpm --dir apps/desktop install --frozen-lockfile
          pnpm --dir apps/desktop run build
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir apps/mobile run build
          rustfmt --edition 2021 --check crates/passshare-core/examples/webview_acceptance.rs
          cargo build -p passshare-core --example webview_acceptance --locked
          cargo build -p passshare-core --example native_process_probe --locked
          cargo test -p passshare-core --example webview_acceptance --locked
          cargo clippy -p passshare-core --examples --locked -- -D warnings
      - name: Prove native policy tests detect missing idle and manual-lock enforcement
        shell: bash
        run: |
          git apply documents/evidence/1197-auto-lock-regression.patch
          trap 'git apply --reverse documents/evidence/1197-auto-lock-regression.patch' EXIT
          set +e
          cargo test -p passshare-desktop native_lock::tests --locked > native-webview-results-regression.log 2>&1
          result=$?
          set -e
          test "$result" -eq 101
          test "$(grep -c '^test native_lock::tests::.* FAILED$' native-webview-results-regression.log)" -eq 3
          grep -q '0 passed; 3 failed' native-webview-results-regression.log
          git apply --reverse documents/evidence/1197-auto-lock-regression.patch
          trap - EXIT
          cargo test -p passshare-desktop native_lock::tests --locked
          git diff --exit-code
      - name: Observe the prior null policy in both real native renderers
        run: |
          trap 'git restore apps/desktop/src-tauri/tauri.conf.json apps/mobile/src-tauri/tauri.conf.json' EXIT
          for config in apps/desktop/src-tauri/tauri.conf.json apps/mobile/src-tauri/tauri.conf.json; do
            jq '.app.security.csp = null' "$config" > "$config.tmp"
            mv "$config.tmp" "$config"
          done
          pnpm --dir apps/desktop exec tauri build --no-bundle
          pnpm --dir apps/mobile exec tauri build --no-bundle
          dbus-run-session -- xvfb-run -a target/debug/examples/webview_acceptance "$PWD/target/release/passshare-desktop" desktop executed "$PWD/native-webview-results"
          dbus-run-session -- xvfb-run -a target/debug/examples/webview_acceptance "$PWD/target/release/passshare-mobile" mobile executed "$PWD/native-webview-results"
          git restore apps/desktop/src-tauri/tauri.conf.json apps/mobile/src-tauri/tauri.conf.json
          git diff --exit-code
      - name: Verify protected rendering, IPC, network and disk failure through native commands
        run: |
          pnpm --dir apps/desktop exec tauri build --no-bundle
          pnpm --dir apps/mobile exec tauri build --no-bundle
          dbus-run-session -- xvfb-run -a target/debug/examples/webview_acceptance "$PWD/target/release/passshare-desktop" desktop blocked "$PWD/native-webview-results"
          dbus-run-session -- xvfb-run -a target/debug/examples/webview_acceptance "$PWD/target/release/passshare-mobile" mobile blocked "$PWD/native-webview-results"
      - name: Verify desktop manual relock and production five-minute idle lock
        run: |
          dbus-run-session -- xvfb-run -a target/debug/examples/webview_acceptance "$PWD/target/release/passshare-desktop" desktop auto-lock "$PWD/native-webview-results"
      - name: Verify mobile native IPC, stale lifecycle proofs and production idle deadline
        run: |
          dbus-run-session -- xvfb-run -a target/debug/examples/webview_acceptance "$PWD/target/release/passshare-mobile" mobile mobile-lock "$PWD/native-webview-results"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-webview-results
          path: |
            native-webview-results/*
            native-webview-results-regression.log
          if-no-files-found: warn
          retention-days: 7
