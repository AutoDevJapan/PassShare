name: Encrypted storage acceptance
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: encrypted-storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: packages/connect-go/go.mod
          cache: false
      - name: Compile the Go session acceptance binary
        working-directory: packages/connect-go
        env:
          GOTOOLCHAIN: local
        run: go test -c -o "$RUNNER_TEMP/passshare-go-session.test"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - run: pnpm --dir backend install --frozen-lockfile
      - name: Check the independent Core contract tool
        run: |
          cargo fmt --manifest-path tools/encrypted-storage-acceptance/Cargo.toml --check
          cargo test --manifest-path tools/encrypted-storage-acceptance/Cargo.toml --locked --all-targets
          cargo clippy --manifest-path tools/encrypted-storage-acceptance/Cargo.toml --locked --all-targets -- -D warnings
          cargo build --manifest-path tools/encrypted-storage-acceptance/Cargo.toml --locked
          cargo build --manifest-path backend/native/Cargo.toml --locked --bin passshare-mutations
      - name: Load the pinned PostgreSQL fixture
        run: docker pull mirror.gcr.io/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
      - name: Verify the formal Node entrypoint with PostgreSQL and Core encryption
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance backend/native/target/debug/passshare-mutations
      - name: Verify Go SDK with formal Node and Rust Core
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --go-session "$RUNNER_TEMP/passshare-go-session.test" backend/native/target/debug/passshare-mutations
      - name: Verify account identity with formal Node and Rust Core
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --account-identity backend/native/target/debug/passshare-mutations
      - name: Verify atomic encrypted attachment storage and rotation with formal Node
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --encrypted-attachments backend/native/target/debug/passshare-mutations
      - name: Verify complete owner migration with the formal Node API
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --encrypted-migration backend/native/target/debug/passshare-mutations
      - name: Verify sharing and atomic revocation with formal Node and Rust Core
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --sharing-rotation backend/native/target/debug/passshare-mutations
      - name: Verify legacy deadline rollback with isolated Node and PostgreSQL
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --legacy-expiry backend/native/target/debug/passshare-mutations
      - name: Verify encrypted backup and isolated restore with formal Node and Rust Core
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --encrypted-restore backend/native/target/debug/passshare-mutations
      - name: Build the actual backend-only distribution image
        run: docker build -t passshare-todo1163-encrypted-api backend
      - name: Verify the distribution image with PostgreSQL and Core encryption
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --image passshare-todo1163-encrypted-api
      - name: Verify Go SDK with the distribution image and Rust Core
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --go-session "$RUNNER_TEMP/passshare-go-session.test" --image passshare-todo1163-encrypted-api
      - name: Verify account identity with the distribution image and Rust Core
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --account-identity --image passshare-todo1163-encrypted-api
      - name: Verify atomic encrypted attachment storage and rotation with the distribution image
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --encrypted-attachments --image passshare-todo1163-encrypted-api
      - name: Verify complete owner migration with the distribution image
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --encrypted-migration --image passshare-todo1163-encrypted-api
      - name: Verify sharing and atomic revocation with the distribution image and Rust Core
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --sharing-rotation --image passshare-todo1163-encrypted-api
      - name: Verify legacy deadline rollback with the distribution image
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --legacy-expiry --image passshare-todo1163-encrypted-api
      - name: Verify encrypted backup and isolated restore with the distribution image
        run: tools/encrypted-storage-acceptance/target/debug/passshare-encrypted-storage-acceptance --encrypted-restore --image passshare-todo1163-encrypted-api
      - name: Leave disposable fixtures to exercise interrupted cleanup ownership
        if: always()
        run: |
          image=mirror.gcr.io/library/postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          if docker image inspect "$image" >/dev/null 2>&1; then
            owned=passshare1163-encrypted-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
            sentinel=passshare1163-cleanup-sentinel-${{ github.run_id }}-${{ github.run_attempt }}
            printf '%s\n' "$sentinel" > "$RUNNER_TEMP/passshare1163-cleanup-sentinel"
            : > "$RUNNER_TEMP/passshare1163-cleanup-volumes"
            docker create --name "$owned" --label passshare.todo=1163 --label passshare.fixture=encrypted-storage "$image"
            docker network create --label passshare.todo=1163 --label passshare.fixture=encrypted-storage "$owned-net"
            docker create --name "$sentinel" --label passshare.todo=1163 --label passshare.fixture=cleanup-sentinel "$image"
            docker network create --label passshare.todo=1163 --label passshare.fixture=cleanup-sentinel "$sentinel-net"
            docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{.Name}}{{println}}{{end}}{{end}}' "$owned" "$sentinel" > "$RUNNER_TEMP/passshare1163-cleanup-volumes"
          fi
      - name: Remove the owned API image and verify fixture cleanup
        if: always()
        run: |
          # This hosted runner's daemon belongs to this job. Cancellation may
          # interrupt Rust Drop, so reclaim only this tool's two ownership labels.
          containers="$(docker ps -aq --filter label=passshare.todo=1163 --filter label=passshare.fixture=encrypted-storage)"
          if [ -n "$containers" ]; then docker rm -fv $containers; fi
          networks="$(docker network ls -q --filter label=passshare.todo=1163 --filter label=passshare.fixture=encrypted-storage)"
          if [ -n "$networks" ]; then docker network rm $networks; fi
          test -z "$(docker ps -aq --filter label=passshare.todo=1163 --filter label=passshare.fixture=encrypted-storage)"
          test -z "$(docker network ls -q --filter label=passshare.todo=1163 --filter label=passshare.fixture=encrypted-storage)"
          if docker image inspect passshare-todo1163-encrypted-api >/dev/null 2>&1; then docker rmi passshare-todo1163-encrypted-api; fi
      - name: Verify that the other fixture label survived and reclaim the sentinel
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/passshare1163-cleanup-sentinel" ]; then
            sentinel="$(cat "$RUNNER_TEMP/passshare1163-cleanup-sentinel")"
            survived=true
            docker container inspect "$sentinel" >/dev/null 2>&1 || survived=false
            docker network inspect "$sentinel-net" >/dev/null 2>&1 || survived=false
            if docker container inspect "$sentinel" >/dev/null 2>&1; then docker rm -v "$sentinel"; fi
            if docker network inspect "$sentinel-net" >/dev/null 2>&1; then docker network rm "$sentinel-net"; fi
            test "$survived" = true
            while IFS= read -r volume; do
              if [ -n "$volume" ] && docker volume inspect "$volume" >/dev/null 2>&1; then exit 1; fi
            done < "$RUNNER_TEMP/passshare1163-cleanup-volumes"
          fi
