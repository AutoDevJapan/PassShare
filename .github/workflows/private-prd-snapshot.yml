name: Private production snapshot helper

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Verify isolated snapshot protocol and cleanup
        run: |
          go -C tools/prd-snapshot-go test -v ./...
          go -C tools/prd-snapshot-go vet ./...
