name: Security Audit

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly advisory sweep — catches CVEs published after a PR merged.
    - cron: "0 3 * * *"

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Install a prebuilt cargo-audit binary. Compiling from source
      # (`cargo install`) turned transient crates.io hiccups into false CI
      # failures on unrelated PRs (#325).
      - name: Install cargo-audit
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-audit

      # Advisory DB is fetched live, so a CVE published after a PR opened would
      # otherwise redden an unrelated PR. Non-blocking on PRs; hard gate on main
      # and the nightly schedule (#325).
      - name: Run cargo-audit
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: cargo audit

  pnpm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - backend
          - frontend
          - apps/desktop
          - apps/mobile
          - packages/connect-js
          - packages/extension
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect package manager
        id: pm
        working-directory: ${{ matrix.directory }}
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.pm.outputs.manager == 'pnpm'
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.pm.outputs.manager == 'pnpm'
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ${{ matrix.directory }}/pnpm-lock.yaml

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.pm.outputs.manager == 'npm'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      # Same policy as cargo-audit: a newly published npm advisory must not
      # redden unrelated PRs. Non-blocking on PRs; hard gate on main + schedule.
      - name: pnpm audit (${{ matrix.directory }})
        if: steps.pm.outputs.manager == 'pnpm'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        working-directory: ${{ matrix.directory }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --audit-level=high

      - name: npm audit (${{ matrix.directory }})
        if: steps.pm.outputs.manager == 'npm'
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        working-directory: ${{ matrix.directory }}
        run: |
          npm install --ignore-scripts
          npm audit --audit-level=high
