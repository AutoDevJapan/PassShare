name: Security Audit

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly advisory sweep — catches CVEs published after a PR merged.
    - cron: "0 3 * * *"

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Install a prebuilt cargo-audit binary. Compiling from source
      # (`cargo install`) turned transient crates.io hiccups into false CI
      # failures on unrelated PRs (#325).
      - name: Install cargo-audit
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: cargo-audit

      # Require the real audit result on PRs as well as main and scheduled runs.
      # A passing job must not hide a failed dependency audit.
      - name: Run cargo-audit
        run: cargo audit
      - name: Audit native mutation dependencies
        run: cargo audit --file backend/native/Cargo.lock

  pnpm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - backend
          - frontend
          - apps/desktop
          - apps/mobile
          - packages/connect-js
          - packages/extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect package manager
        id: pm
        working-directory: ${{ matrix.directory }}
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.pm.outputs.manager == 'pnpm'
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.pm.outputs.manager == 'pnpm'
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ${{ matrix.directory }}/pnpm-lock.yaml

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.pm.outputs.manager == 'npm'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      # Keep the same audit gate for PR, main and scheduled runs.
      - name: pnpm audit (${{ matrix.directory }})
        if: steps.pm.outputs.manager == 'pnpm'
        working-directory: ${{ matrix.directory }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm audit --audit-level=high

      - name: npm audit (${{ matrix.directory }})
        if: steps.pm.outputs.manager == 'npm'
        working-directory: ${{ matrix.directory }}
        run: |
          npm install --ignore-scripts
          npm audit --audit-level=high
