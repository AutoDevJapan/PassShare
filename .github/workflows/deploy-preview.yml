name: Deploy Preview Backend

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-backend-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Preview deploy token gate
        id: token_gate
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
        run: |
          if [ -z "${RAILWAY_PROJECT_TOKEN}" ]; then
            echo "::warning::RAILWAY_PROJECT_TOKEN is not configured — skipping preview deploy. Create a Project Token for the preview environment in Railway and add it to GitHub Secrets. SSOT: documents/spec/infrastructure.md"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.token_gate.outputs.deploy == 'true'
        with:
          version: 10.11.0

      - uses: actions/setup-node@v6
        if: steps.token_gate.outputs.deploy == 'true'
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        if: steps.token_gate.outputs.deploy == 'true'
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        if: steps.token_gate.outputs.deploy == 'true'
        run: npm install -g @railway/cli@3.20.2

      - name: Deploy backend to Railway (preview)
        if: steps.token_gate.outputs.deploy == 'true'
        env:
          RAILWAY_PROJECT_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_PREVIEW_ENV_ID }}
          RAILWAY_HEALTH_URL: https://pass-share-backend-preview.up.railway.app/health/db
        run: bash scripts/railway-deploy-ci.sh

      - name: Preview deploy skipped (documented)
        if: steps.token_gate.outputs.deploy != 'true'
        run: echo "Preview deploy skipped — configure RAILWAY_PROJECT_TOKEN to enable."
