name: Extension Build

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: extension-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Exact package/browser/system-dependency closure, without an apt download
    # from the hosted image's temporarily unresolvable Ubuntu archive mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:cf0daee9b994042e011bc29f20cdff1a9f682a039b43fcd738f7d8a9d3bcd9d6
      options: --ipc=host
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.11.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            packages/extension/pnpm-lock.yaml
            packages/connect-js/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm --dir packages/connect-js install --frozen-lockfile
          pnpm --dir packages/connect-js run build
          pnpm --dir packages/extension install --frozen-lockfile

      - name: Install backend dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Install root dev dependencies (Playwright)
        run: pnpm install --frozen-lockfile

      - name: Run extension unit tests
        run: pnpm --dir packages/extension test

      - name: Build extension
        run: pnpm --dir packages/extension run build

      - name: Run extension auth API tests
        working-directory: backend
        run: node --test test/extension-auth.test.js

      - name: Verify pinned Playwright browser and dependency image
        run: |
          node -e "if(require('@playwright/test/package.json').version!=='1.61.1')process.exit(1)"
          pnpm exec playwright --version

      - name: Run extension E2E smoke
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: "true"
          USE_XVFB: "1"
        run: xvfb-run -a pnpm exec playwright test -c playwright.extension.config.ts
