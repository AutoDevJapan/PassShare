services:
  postgres:
    # Pinned by digest so CI is reproducible and immune to a mutated tag
    # (supply-chain hardening, #325). Refresh the digest when bumping the tag:
    #   docker pull postgres:16-alpine && \
    #   docker inspect --format='{{index .RepoDigests 0}}' postgres:16-alpine
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    environment:
      POSTGRES_USER: passshare
      POSTGRES_PASSWORD: passshare
      POSTGRES_DB: passshare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passshare -d passshare"]
      interval: 2s
      timeout: 5s
      retries: 15

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    volumes:
      - ..:/app
    working_dir: /app

  rust-test:
    extends:
      service: test

  backend-e2e:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend-e2e
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ..:/app
    working_dir: /app
    environment:
      CI: "true"
      DATABASE_URL: postgresql://passshare:passshare@postgres:5432/passshare
      OP_CONNECT_TOKEN: test-connect-token
      OP_CLI_BIN: /app/target/release/op
    command: >
      sh -c "cargo build -p op-cli --release &&
             pnpm --dir backend install --frozen-lockfile &&
             node --test backend/test/pg-integration.test.js backend/test/op-cli-e2e.test.js backend/test/cloud-sync.integration.test.js backend/test/cross-client.integration.test.js backend/test/vault-invitation.integration.test.js backend/test/connect-token-revocation.integration.test.js"
