services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: passshare
      POSTGRES_PASSWORD: passshare
      POSTGRES_DB: passshare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passshare -d passshare"]
      interval: 2s
      timeout: 5s
      retries: 15

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    volumes:
      - ..:/app
    working_dir: /app

  rust-test:
    extends:
      service: test

  backend-e2e:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend-e2e
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ..:/app
    working_dir: /app
    environment:
      CI: "true"
      DATABASE_URL: postgresql://passshare:passshare@postgres:5432/passshare
      OP_CONNECT_TOKEN: test-connect-token
      OP_CLI_BIN: /app/target/release/op
    command: >
      sh -c "pnpm --dir backend install --frozen-lockfile &&
             node --test backend/test/pg-integration.test.js backend/test/op-cli-e2e.test.js backend/test/cloud-sync.integration.test.js"
