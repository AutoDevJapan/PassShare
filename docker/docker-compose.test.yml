services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: passshare
      POSTGRES_PASSWORD: passshare
      POSTGRES_DB: passshare
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passshare -d passshare"]
      interval: 2s
      timeout: 5s
      retries: 15

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    volumes:
      - ..:/app
    working_dir: /app

  rust-test:
    extends:
      service: test

  backend-e2e:
    image: node:22-bookworm
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ..:/app
    working_dir: /app/backend
    environment:
      CI: "true"
      DATABASE_URL: postgresql://passshare:passshare@postgres:5432/passshare
      OP_CONNECT_TOKEN: test-connect-token
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@10.11.0 --activate &&
             pnpm install --frozen-lockfile &&
             node --test test/pg-integration.test.js"
