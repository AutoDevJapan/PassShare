# cargo-audit configuration
# See: https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# `ignore` should list ONLY advisories that cannot currently be resolved by a
# dependency bump, each with a documented reason and tracking issue. Revisit
# whenever `plist` / `tauri` are updated.

[advisories]
ignore = [
    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml 0.39.x
    # Quadratic runtime / unbounded namespace allocation (DoS) — patched in >=0.41.0.
    # Transitive via `plist 1.9.0` (requires quick-xml ^0.39.2) -> tauri 2.11.2.
    # No plist release uses quick-xml >=0.41 yet, and quick-xml 0.41 is a breaking
    # API change, so the tree cannot be bumped. Only affects parsing of trusted
    # local .plist bundle metadata, not untrusted input.
    # Tracking: https://github.com/AutoDevJapan/PassShare/issues/308
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
