[package]
name = "passshare-encrypted-storage-acceptance"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "AGPL-3.0-only"

[workspace]

[dependencies]
serde_json = "1"
base64 = "0.22"
passshare-core = { path = "../../crates/passshare-core" }
passshare-connect = { path = "../../crates/passshare-connect" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
passshare-mutations = { path = "../../backend/native" }
