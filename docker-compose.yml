services:
  postgres:
    container_name: passshare-postgres
    restart: always
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      TZ: Asia/Tokyo
      POSTGRES_USER: ${POSTGRES_USER:-passshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-passshare_db}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-passshare} -d ${POSTGRES_DB:-passshare_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: passshare-api
    restart: always
    tty: true
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      TZ: Asia/Tokyo
      # Database (PostgreSQL)
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-passshare}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DB_NAME: ${POSTGRES_DB:-passshare_db}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-passshare}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-passshare_db}
      # API
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      DEBUG: ${DEBUG:-false}
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # GitHub
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-bm1314/passshare}
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    volumes:
      - ./backend:/app
      - /app/.venv
      - backend-logs:/app/logs
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read();",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backend-logs:
